<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Китай · учёт</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236C8CFF'/><text x='50' y='68' font-size='46' text-anchor='middle' fill='%2306070C' font-family='sans-serif' font-weight='800'>КН</text></svg>">
<style>
:root{
  --bg:#06070C; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.05);
  --text:#EEF1F8; --muted:#8B94A8; --dim:#5F6779;
  --indigo:#6C8CFF; --cyan:#3ED8D0; --amber:#FFB65C; --green:#57E39B; --rose:#FF7B93;
  --shadow:0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;
  font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.aura{position:fixed;inset:-25%;z-index:0;filter:blur(90px);opacity:.5;pointer-events:none}
.aura i{position:absolute;border-radius:50%;display:block}
.a1{width:46vw;height:46vw;left:-6%;top:-10%;background:radial-gradient(circle,#3F4CE0,transparent 65%);animation:d1 26s ease-in-out infinite}
.a2{width:40vw;height:40vw;right:-4%;top:4%;background:radial-gradient(circle,#0E9C9C,transparent 65%);animation:d2 32s ease-in-out infinite}
.a3{width:38vw;height:38vw;left:34%;bottom:-18%;background:radial-gradient(circle,#B4632A,transparent 66%);animation:d3 38s ease-in-out infinite}
@keyframes d1{50%{transform:translate(14vw,8vh) scale(1.15)}}
@keyframes d2{50%{transform:translate(-12vw,12vh) scale(1.1)}}
@keyframes d3{50%{transform:translate(8vw,-10vh) scale(1.18)}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.app{position:relative;z-index:2;display:grid;grid-template-columns:78px 1fr;min-height:100vh}
/* пульт */
.rail{padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:6px;
  border-right:1px solid var(--line2);background:rgba(255,255,255,.02);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px;
  background:linear-gradient(145deg,#6C8CFF,#3ED8D0);color:#06070C;font-weight:800;font-size:14px;
  box-shadow:0 8px 24px rgba(108,140,255,.45);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px);box-shadow:0 16px 34px rgba(108,140,255,.55)}}
.rail a{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--dim);
  position:relative;transition:.25s cubic-bezier(.4,0,.2,1);cursor:pointer}
.rail a:hover{color:var(--text);background:var(--glass);transform:translateY(-2px)}
.rail a.on{color:var(--text);background:linear-gradient(160deg,rgba(108,140,255,.28),rgba(62,216,208,.12));
  box-shadow:inset 0 0 0 1px rgba(108,140,255,.3)}
.rail a.on::before{content:"";position:absolute;left:-13px;width:3px;height:22px;border-radius:2px;
  background:linear-gradient(#6C8CFF,#3ED8D0);box-shadow:0 0 12px #6C8CFF}
.rail .sp{flex:1}
main{padding:26px 30px 60px;max-width:1520px;width:100%}
header.top{display:flex;align-items:flex-end;gap:18px;margin-bottom:24px;animation:up .7s .05s both}
h1{font-size:29px;font-weight:700;letter-spacing:-.9px}
h1 span{background:linear-gradient(92deg,#6C8CFF,#3ED8D0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:10px;padding-bottom:3px}
.srch{padding:9px 15px;border-radius:12px;color:var(--text);font-size:13.5px;min-width:210px;border:1px solid var(--line);
  background:var(--glass);outline:none}
.srch::placeholder{color:var(--muted)}
.srch:focus{border-color:rgba(108,140,255,.5)}
.pill{padding:10px 17px;border-radius:12px;font-size:13.5px;font-weight:650;color:#06070C;border:0;cursor:pointer;
  background:linear-gradient(135deg,#7E9BFF,#4FD6CE);box-shadow:0 10px 26px rgba(108,140,255,.35);transition:.25s;white-space:nowrap}
.pill:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(108,140,255,.5)}
.ghost{padding:9px 15px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;
  background:var(--glass);border:1px solid var(--line);transition:.25s;white-space:nowrap}
.ghost:hover{background:var(--glass2);transform:translateY(-1px)}
.avatar{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:13px;cursor:pointer}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:18px 20px 15px;border-radius:20px;position:relative;overflow:hidden;transition:.35s cubic-bezier(.4,0,.2,1);animation:up .8s both}
.kpi:nth-child(2){animation-delay:.08s}.kpi:nth-child(3){animation-delay:.16s}.kpi:nth-child(4){animation-delay:.24s}
.kpi:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.18)}
.kpi::after{content:"";position:absolute;inset:0;border-radius:20px;opacity:0;transition:.35s;
  background:radial-gradient(420px 130px at 22% 0%,rgba(108,140,255,.18),transparent 70%)}
.kpi:hover::after{opacity:1}
.lab{color:var(--muted);font-size:11.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase}
.val{font-size:29px;font-weight:750;letter-spacing:-1.2px;margin:9px 0 2px}
.dt{font-size:12.5px;color:var(--dim)}
.v-amber{color:var(--amber)}.v-green{color:var(--green)}.v-cyan{color:var(--cyan)}
/* панели */
.grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.panel{border-radius:22px;overflow:hidden;box-shadow:var(--shadow);animation:up .8s .3s both}
.ph{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ph h2{font-size:15.5px;font-weight:650;letter-spacing:-.2px}
.tabs{margin-left:auto;display:flex;gap:5px;padding:4px;border-radius:13px;background:rgba(255,255,255,.04)}
.tab{padding:6px 13px;border-radius:10px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:.25s;white-space:nowrap}
.tab.on{background:rgba(255,255,255,.1);color:var(--text);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.35)}
/* партия */
.ship{padding:17px 18px;border-bottom:1px solid var(--line2);transition:.3s;animation:up .6s both}
.ship:hover{background:rgba(255,255,255,.035)}
.ship:last-child{border-bottom:0}
.ship-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who{font-weight:650;font-size:15px;letter-spacing:-.2px}
.meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.tag{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.t-shipping{color:var(--amber);background:rgba(255,182,92,.12)}
.t-new{color:var(--muted);background:rgba(255,255,255,.06)}
.t-arrived{color:var(--green);background:rgba(87,227,155,.12)}
.t-cancelled{color:var(--rose);background:rgba(255,123,147,.1)}
.money{margin-left:auto;text-align:right}
.money b{font-size:19px;font-weight:700;letter-spacing:-.5px}
.money .m2{color:var(--dim);font-size:12px;margin-top:2px}
.acts{display:flex;gap:4px}
.mini-btn{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:15px;padding:4px 7px;border-radius:8px;transition:.2s}
.mini-btn:hover{background:rgba(108,140,255,.15);color:var(--text)}
.route{margin-top:15px;display:flex;align-items:flex-start}
.node{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:72px}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.dot.done{background:linear-gradient(#6C8CFF,#3ED8D0);box-shadow:0 0 14px rgba(108,140,255,.8)}
.dot.live{background:var(--amber);animation:pulse 2s infinite}
.dot.fin{background:var(--green);box-shadow:0 0 14px rgba(87,227,155,.7)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,182,92,.55)}70%{box-shadow:0 0 0 13px rgba(255,182,92,0)}100%{box-shadow:0 0 0 0 rgba(255,182,92,0)}}
.node span{font-size:11px;color:var(--dim);white-space:nowrap}
.node.act span{color:var(--amber);font-weight:600}
.node.fin span{color:var(--green);font-weight:600}
.seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;margin-top:4px}
.seg i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#6C8CFF,#3ED8D0);
  width:var(--w,0%);transition:width 1.6s cubic-bezier(.4,0,.2,1)}
.seg.flow::after{content:"";position:absolute;top:0;bottom:0;width:46px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:flow 2.4s linear infinite}
@keyframes flow{from{left:-16%}to{left:104%}}
.chips{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;color:var(--muted);padding:4px 10px;border-radius:9px;background:rgba(255,255,255,.045);white-space:nowrap}
.chip.warn{color:var(--amber);background:rgba(255,182,92,.1)}
.paybar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.paybar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#57E39B,#3ED8D0);
  width:var(--w,0%);transition:width 1.4s cubic-bezier(.4,0,.2,1)}
.items-tbl{margin-top:13px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;display:none}
.ship.open .items-tbl{display:block}
.items-tbl table{width:100%;border-collapse:collapse}
.items-tbl th{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;text-align:left;
  padding:8px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line2)}
.items-tbl td{font-size:13px;padding:8px 12px;border-bottom:1px solid var(--line2)}
.items-tbl tr:last-child td{border-bottom:0}
.num{text-align:right}
.badge{display:inline-block;padding:2px 8px;border-radius:7px;background:rgba(108,140,255,.16);color:var(--indigo);font-size:11.5px;font-weight:650}
/* правая колонка */
aside{display:flex;flex-direction:column;gap:16px;animation:up .8s .4s both}
.card{border-radius:20px;padding:18px}
.card h3{font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;gap:10px}
.stat+.stat{border-top:1px solid var(--line2)}
.stat .l{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .v{font-weight:650;font-size:14.5px;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:7px;height:78px;margin-top:4px}
.bars i{flex:1;border-radius:5px 5px 3px 3px;background:linear-gradient(180deg,rgba(108,140,255,.85),rgba(62,216,208,.25));
  height:var(--h,0%);transition:height 1.1s cubic-bezier(.4,0,.2,1)}
.bars i.cur{background:linear-gradient(180deg,#7E9BFF,rgba(62,216,208,.35));box-shadow:0 0 22px rgba(108,140,255,.45)}
.bl{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--dim)}
.bl span{flex:1;text-align:center}
/* таблицы справочников */
.list-tbl{width:100%;border-collapse:collapse}
.list-tbl th{text-align:left;font-size:11px;font-weight:650;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;
  padding:11px 16px;border-bottom:1px solid var(--line2)}
.list-tbl td{padding:12px 16px;border-bottom:1px solid var(--line2);font-size:14px}
.list-tbl tr:hover td{background:rgba(255,255,255,.03)}
.list-tbl tr:last-child td{border-bottom:0}
.inactive{opacity:.45}
/* пусто */
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:16px;color:var(--text);margin-bottom:6px}
.empty .pill{margin-top:16px}
/* модалки */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,5,9,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{width:100%;max-width:760px;border-radius:22px;box-shadow:var(--shadow);animation:up .3s both;
  background:rgba(20,23,32,.92);border:1px solid var(--line);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.modal.small{max-width:440px}
.mh{display:flex;align-items:center;padding:18px 22px 14px;border-bottom:1px solid var(--line2)}
.mh h2{font-size:17px;font-weight:650;letter-spacing:-.3px}
.mh .x{margin-left:auto;border:0;background:transparent;color:var(--dim);font-size:21px;cursor:pointer;padding:2px 8px;border-radius:8px}
.mh .x:hover{color:var(--text);background:rgba(255,255,255,.06)}
.mb{padding:18px 22px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line2);flex-wrap:wrap}
.frm{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.fg input,.fg select,.fg textarea{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font:inherit;font-size:14px;padding:9px 12px;outline:none;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:rgba(108,140,255,.55)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}
.itm-head{display:flex;align-items:center;margin:20px 0 8px}
.itm-head h4{font-size:13px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.5px}
.itm-row{display:grid;grid-template-columns:92px 1fr 74px 72px 88px 100px 34px;gap:8px;margin-bottom:8px;align-items:center}
.itm-row input,.itm-row select{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font:inherit;font-size:13.5px;padding:8px 10px;outline:none;width:100%}
.itm-row input:focus,.itm-row select:focus{border-color:rgba(108,140,255,.55)}
.itm-del{border:0;background:transparent;color:var(--dim);font-size:17px;cursor:pointer;border-radius:8px;padding:4px}
.itm-del:hover{color:var(--rose)}
.itm-cols{display:grid;grid-template-columns:92px 1fr 74px 72px 88px 100px 34px;gap:8px;font-size:10.5px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.msum{display:flex;gap:22px;justify-content:flex-end;margin-top:14px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.msum b{color:var(--text);font-size:15px}
/* вход */
#login-ov{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#login-ov.show{display:flex}
.login-card{width:100%;max-width:380px;border-radius:24px;padding:34px 30px;text-align:center;box-shadow:var(--shadow);
  background:rgba(20,23,32,.85);border:1px solid var(--line);backdrop-filter:blur(30px);position:relative;z-index:2;animation:up .5s both}
.login-card .mark{margin:0 auto 18px}
.login-card h2{font-size:21px;letter-spacing:-.5px;margin-bottom:4px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:22px}
.login-card input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font:inherit;padding:11px 14px;outline:none;margin-bottom:10px}
.login-card input:focus{border-color:rgba(108,140,255,.55)}
.login-card .pill{width:100%;margin-top:8px}
.login-err{color:var(--rose);font-size:12.5px;min-height:18px;margin-top:8px}
/* тосты */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:11px 18px;border-radius:12px;font-size:13.5px;background:rgba(24,28,38,.95);border:1px solid var(--line);
  box-shadow:var(--shadow);animation:up .3s both}
.toast.ok{border-color:rgba(87,227,155,.4)}
.toast.err{border-color:rgba(255,123,147,.5)}
/* статус-поповер */
#st-pop{position:absolute;z-index:60;display:none;flex-direction:column;gap:3px;padding:6px;border-radius:14px;
  background:rgba(24,28,38,.97);border:1px solid var(--line);box-shadow:var(--shadow)}
#st-pop .tag{justify-content:flex-start}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* телефон */
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;left:0;right:0;z-index:40;flex-direction:row;justify-content:space-around;
    padding:9px 8px calc(9px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);
    background:rgba(10,12,18,.82)}
  .rail .mark,.rail .sp{display:none}
  .rail a{width:52px;height:42px;border-radius:12px}
  .rail a.on::before{left:50%;top:-10px;transform:translateX(-50%);width:20px;height:3px}
  main{padding:18px 15px 100px;max-width:100%;overflow-x:hidden}
  header.top{flex-wrap:wrap;gap:12px}
  h1{font-size:24px}
  .sub{font-size:12.5px}
  .hd-r{width:100%;margin-left:0;gap:8px}
  .srch{flex:1;min-width:0}
  .pill{padding:10px 13px;font-size:13px}
  .kpis{grid-template-columns:1fr 1fr;gap:11px}
  .kpi{padding:15px 15px 13px;min-width:0}
  .val{font-size:22px;letter-spacing:-.9px}
  .lab{font-size:10.5px}.dt{font-size:11.5px}
  .grid{grid-template-columns:1fr;min-width:0}
  .panel,aside,.card{min-width:0}
  .tabs{margin-left:0;width:100%;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none}
  .money{width:100%;margin:10px 0 0;text-align:left;display:flex;align-items:baseline;gap:10px}
  .money .m2{margin:0}
  .chips{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .node{min-width:58px}
  .itm-row,.itm-cols{grid-template-columns:80px 1fr 60px 84px 30px}
  .itm-qty,.itm-unitcol{display:none}
  .list-wrap{overflow-x:auto}
}
</style>
</head>
<body>
<div class="aura"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

<div id="login-ov">
  <div class="aura"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
  <form class="login-card" id="login-form">
    <div class="mark">КН</div>
    <h2>Китай · учёт</h2>
    <p>Партии, авансы, поставщики, инвесторы</p>
    <input id="l-login" placeholder="Логин" autocomplete="username">
    <input id="l-pass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="pill" type="submit">Войти</button>
    <div class="login-err" id="l-err"></div>
  </form>
</div>

<div class="app" id="app" style="display:none">
  <div class="rail" id="rail">
    <div class="mark">КН</div>
    <a data-sec="ships" title="Партии"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg></a>
    <a data-sec="partners" title="Поставщики"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></a>
    <a data-sec="investors" title="Инвесторы"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></a>
    <a data-sec="stores" title="Магазины"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0"/></svg></a>
    <a data-sec="summary" title="Сводка"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg></a>
    <div class="sp"></div>
    <a data-sec="settings" title="Настройки"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15a2 2 0 110-4 1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 009 4.6a2 2 0 114 0 1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 11a2 2 0 110 4z"/></svg></a>
  </div>
  <main id="main"></main>
</div>

<div class="overlay" id="modal-ov"><div class="modal" id="modal"></div></div>
<div id="st-pop"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const CUR={USD:"$",CNY:"¥",KGS:"с"};
const ST_RU={new:"Не отправлен",shipping:"В пути",arrived:"Прибыл",cancelled:"Отменён"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtN(v){return (Math.round((+v||0)*100)/100).toLocaleString("ru-RU",{maximumFractionDigits:2}).replace(/,/g,".").replace(/ /g," ")}
function money(v,cur){cur=cur||"USD";const s=fmtN(v);return cur==="KGS"?s+" с":(CUR[cur]||"")+s}
function dRu(d){if(!d)return"";const[y,m,dd]=d.split("-");return dd+"."+m+"."+y}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
async function api(path,opts={}){
  const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts,
    body:opts.body?JSON.stringify(opts.body):undefined});
  if(r.status===401){showLogin();throw new Error("Нужен вход")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Ошибка "+r.status);
  return j;
}
function toast(msg,cls){const t=document.createElement("div");t.className="toast "+(cls||"");t.textContent=msg;
  $("#toasts").appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transition=".4s";setTimeout(()=>t.remove(),400)},2600)}
function confirmBox(title,text,danger){
  return new Promise(res=>{
    openModal(`<div class="mh"><h2>${esc(title)}</h2><button class="x" data-x>×</button></div>
      <div class="mb" style="color:var(--muted);font-size:14px">${esc(text)}</div>
      <div class="mf"><button class="ghost" data-x>Отмена</button>
      <button class="pill" id="cf-ok" ${danger?'style="background:linear-gradient(135deg,#FF8FA5,#FF7B93);box-shadow:0 10px 26px rgba(255,123,147,.3)"':""}>${danger?"Удалить":"Да"}</button></div>`,true);
    $("#cf-ok").onclick=()=>{closeModal();res(true)};
    $$("#modal [data-x]").forEach(b=>b.onclick=()=>{closeModal();res(false)});
  });
}
function openModal(html,small){$("#modal").className="modal"+(small?" small":"");$("#modal").innerHTML=html;
  $("#modal-ov").classList.add("show");
  $$("#modal [data-x]").forEach(b=>b.onclick=closeModal)}
function closeModal(){$("#modal-ov").classList.remove("show")}
$("#modal-ov").addEventListener("mousedown",e=>{if(e.target.id==="modal-ov")closeModal()});
function counter(el,to,cur){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=money(to,cur);return}
  const t0=performance.now(),dur=1100;
  function step(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
    el.textContent=money(to*e,cur);if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}
/* ---------- состояние ---------- */
const S={user:null,section:"ships",tab:"",q:"",stores:[],partners:[],ships:null,sum:null};
/* ---------- вход ---------- */
function showLogin(){$("#login-ov").classList.add("show");$("#app").style.display="none"}
$("#login-form").onsubmit=async e=>{
  e.preventDefault();$("#l-err").textContent="";
  try{
    const r=await api("/api/login",{method:"POST",body:{login:$("#l-login").value,password:$("#l-pass").value}});
    S.user=r.user;$("#login-ov").classList.remove("show");$("#app").style.display="";go(S.section);
  }catch(err){$("#l-err").textContent=err.message}
};
/* ---------- навигация ---------- */
$$("#rail a").forEach(a=>a.onclick=()=>go(a.dataset.sec));
function go(sec){S.section=sec;location.hash=sec;
  $$("#rail a").forEach(a=>a.classList.toggle("on",a.dataset.sec===sec));
  ({ships:renderShips,partners:renderPartners,investors:renderInvestors,
    stores:renderStores,summary:renderSummary,settings:renderSettings})[sec]();
}
/* ---------- справочные данные ---------- */
async function loadRefs(){[S.stores,S.partners]=await Promise.all([api("/api/stores"),api("/api/partners")])}
const activeStores=()=>S.stores.filter(s=>s.active);
const activeSuppliers=()=>S.partners.filter(p=>p.active&&p.is_supplier);
/* ---------- ПАРТИИ ---------- */
async function renderShips(){
  $("#main").innerHTML=headHtml("Партии <span>из Китая</span>","",`
    <input class="srch" id="q" placeholder="Поиск по товару, треку…" value="${esc(S.q)}">
    <button class="pill" id="add-ship">+ Новая партия</button>
    <div class="glass avatar" title="${esc(S.user?.name||"")}">${esc((S.user?.name||"А")[0])}</div>`)+
   `<div class="kpis" id="kpis"></div>
    <div class="grid"><div class="glass panel">
      <div class="ph"><h2>Партии в работе</h2>
        <div class="tabs" id="tabs">
          ${[["","Все"],["shipping","В пути"],["new","Не отправлены"],["arrived","Прибыли"],["cancelled","Отменены"]]
            .map(([v,l])=>`<div class="tab${S.tab===v?" on":""}" data-v="${v}">${l}</div>`).join("")}
        </div></div>
      <div id="ship-list"><div class="empty">Загрузка…</div></div>
    </div>
    <aside id="aside"></aside></div>`;
  $("#add-ship").onclick=()=>shipModal();
  let qt;$("#q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;loadShips()},350)};
  $$("#tabs .tab").forEach(t=>t.onclick=()=>{S.tab=t.dataset.v;
    $$("#tabs .tab").forEach(x=>x.classList.toggle("on",x===t));loadShips()});
  await loadRefs();
  await Promise.all([loadShips(),loadSummaryUI()]);
}
function headHtml(title,sub,right){
  return `<header class="top"><div><h1>${title}</h1><div class="sub" id="hd-sub">${sub}</div></div>
    <div class="hd-r">${right||""}</div></header>`;
}
async function loadShips(){
  const p=new URLSearchParams();if(S.tab)p.set("status",S.tab);if(S.q)p.set("q",S.q);
  const d=await api("/api/shipments?"+p);S.ships=d;
  const el=$("#ship-list");
  if(!d.rows.length){
    el.innerHTML=`<div class="empty"><b>${S.tab||S.q?"Ничего не найдено":"Партий пока нет"}</b>
      ${S.tab||S.q?"Попробуйте другой фильтр":"Создайте первую партию — это займёт минуту"}
      ${!S.tab&&!S.q?'<br><button class="pill" onclick="shipModal()">+ Новая партия</button>':""}</div>`;
  }else{
    el.innerHTML=d.rows.map(shipHtml).join("")+
     `<div class="ship" style="background:rgba(255,255,255,.03);cursor:default">
        <div class="ship-top"><div class="who" style="font-size:13.5px;color:var(--muted)">
          Итого по фильтру: ${d.totals.count} парт. · ${d.totals.items} поз.</div>
        <div class="money"><b>${money(d.totals.amount)}</b>
          <div class="m2">авансы ${money(d.totals.prepaid)} · остаток ${money(d.totals.balance)}</div></div></div></div>`;
    bindShipActions();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      $$(".seg i").forEach(i=>i.style.width=i.dataset.w+"%");
      $$(".paybar i").forEach(i=>i.style.width=i.dataset.w+"%");
    }));
  }
  const sub=$("#hd-sub");
  if(sub)sub.textContent=new Date().toLocaleDateString("ru-RU",{month:"long",year:"numeric"})
    +" · "+d.totals.count+" партий · "
    +(S.ships.rows.filter(s=>s.status==="shipping").length)+" едут прямо сейчас";
}
function routeHtml(s){
  if(s.status==="cancelled")return"";
  const origin=s.supplier_city||s.supplier_name.split("—")[0].trim();
  let p1=0,p2=0,n1="",n2="",n3="",flow1=false,flow2=false;
  if(s.status==="new"){n1="act"}
  else if(s.status==="arrived"){p1=100;p2=100;n1="done";n2="done";n3="fin"}
  else{ // shipping: прогресс по датам
    let pr=.35;
    if(s.sent_date&&s.eta_date){
      const a=new Date(s.sent_date),b=new Date(s.eta_date),t=new Date();
      pr=Math.min(.95,Math.max(.05,(t-a)/(b-a||1)))}
    if(pr<.5){p1=pr*200;n1="done";n2="act2";flow1=true}
    else{p1=100;p2=(pr-.5)*200;n1="done";n2="act";flow2=true}
  }
  const dot=c=>c==="done"?"done":c==="act"||c==="act2"?"live":c==="fin"?"fin":"";
  return `<div class="route">
    <div class="node ${n1==="act"?"act":""}"><span class="dot ${dot(n1)}"></span><span>${esc(origin)}</span></div>
    <div class="seg ${flow1?"flow":""}"><i data-w="${p1}"></i></div>
    <div class="node ${n2.startsWith("act")?"act":""}"><span class="dot ${dot(n2)}"></span><span>Урумчи</span></div>
    <div class="seg ${flow2?"flow":""}"><i data-w="${p2}"></i></div>
    <div class="node ${n3==="fin"?"fin":""}"><span class="dot ${dot(n3)}"></span><span>Бишкек</span></div></div>`;
}
function shipHtml(s){
  const chips=[];
  if(s.status==="shipping"&&s.days_transit!=null)chips.push(["в пути "+s.days_transit+" дн."]);
  if(s.status==="shipping"&&s.eta_date){
    const late=s.eta_date<todayISO();
    chips.push([late?"задержка — ждали "+dRu(s.eta_date):"ожидается "+dRu(s.eta_date),late?"warn":""]);}
  if(s.status==="new")chips.push(["заказана "+dRu(s.date)]);
  if(s.status==="arrived"&&s.arrived_date)chips.push(["прибыла "+dRu(s.arrived_date)]);
  if(s.stores.length)chips.push(["магазин"+(s.stores.length>1?"ы":"")+" №"+s.stores.join(" · №")]);
  const pay=s.amount?Math.min(100,(s.prepaid||0)/s.amount*100):0;
  return `<div class="ship" data-id="${s.id}">
    <div class="ship-top">
      <div style="cursor:pointer" data-open><div class="who">${esc(s.supplier_name)}</div>
        <div class="meta">${dRu(s.date)} · ${s.items.length} поз.${s.track?" · трек "+esc(s.track):""}</div></div>
      <button class="tag t-${s.status}" data-st>${ST_RU[s.status]}</button>
      <div class="money"><b>${money(s.amount,s.currency)}</b>
        <div class="m2">${s.status==="cancelled"?"не считается":
          (s.balance<=0.004?"оплачено полностью":"аванс "+money(s.prepaid||0,s.currency)+" · остаток "+money(s.balance,s.currency))}</div></div>
      <div class="acts"><button class="mini-btn" data-edit title="Редактировать">✎</button>
        <button class="mini-btn" data-copy title="Дублировать">⧉</button>
        <button class="mini-btn" data-del title="Удалить">🗑</button></div>
    </div>
    ${routeHtml(s)}
    ${chips.length?`<div class="chips">${chips.map(([t,c])=>`<span class="chip ${c||""}">${esc(t)}</span>`).join("")}</div>`:""}
    ${s.status!=="cancelled"&&s.amount?`<div class="paybar" title="Оплачено ${Math.round(pay)}%"><i data-w="${pay}"></i></div>`:""}
    <div class="items-tbl"><table>
      <tr><th>Магазин</th><th>Товар</th><th class="num">Кол-во</th><th class="num">Цена</th><th class="num">Сумма</th></tr>
      ${s.items.map(i=>`<tr><td><span class="badge">№${esc(i.store_number)}</span></td><td>${esc(i.product)}</td>
        <td class="num">${i.qty?fmtN(i.qty)+" "+esc(i.unit||""):"—"}</td>
        <td class="num">${i.unit_price?money(i.unit_price,s.currency):"—"}</td>
        <td class="num"><b>${money(i.amount,s.currency)}</b></td></tr>`).join("")}
    </table></div></div>`;
}
function bindShipActions(){
  $$(".ship[data-id]").forEach(el=>{
    const id=+el.dataset.id,s=S.ships.rows.find(x=>x.id===id);if(!s)return;
    el.querySelector("[data-open]").onclick=()=>el.classList.toggle("open");
    el.querySelector("[data-edit]").onclick=()=>shipModal(s);
    el.querySelector("[data-copy]").onclick=()=>shipModal({...s,id:null,date:todayISO(),status:"new",
      sent_date:null,arrived_date:null,eta_date:null,track:"",prepaid:0});
    el.querySelector("[data-del]").onclick=async()=>{
      if(await confirmBox("Удалить партию?",`${s.supplier_name}, ${dRu(s.date)}, ${s.items.length} поз. на ${money(s.amount,s.currency)}. Партия будет скрыта из списков.`,true)){
        await api("/api/shipments/"+id,{method:"DELETE"});toast("Партия удалена","ok");loadShips();loadSummaryUI();loadRefs();}};
    el.querySelector("[data-st]").onclick=e=>{e.stopPropagation();statusPop(e.target,s)};
  });
}
function statusPop(btn,s){
  const pop=$("#st-pop");
  pop.innerHTML=Object.entries(ST_RU).map(([v,l])=>
    `<button class="tag t-${v}" data-v="${v}" ${v===s.status?'style="outline:1px solid rgba(255,255,255,.25)"':""}>${l}</button>`).join("");
  const r=btn.getBoundingClientRect();
  pop.style.left=Math.min(r.left,innerWidth-180)+"px";pop.style.top=(r.bottom+scrollY+6)+"px";pop.style.display="flex";
  pop.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{
    pop.style.display="none";
    if(b.dataset.v===s.status)return;
    await api("/api/shipments/"+s.id,{method:"PATCH",body:{status:b.dataset.v}});
    toast("Статус: "+ST_RU[b.dataset.v],"ok");loadShips();loadSummaryUI();});
  setTimeout(()=>document.addEventListener("click",function h(e){
    if(!pop.contains(e.target)){pop.style.display="none";document.removeEventListener("click",h)}}),0);
}
/* ---------- KPI + правая колонка ---------- */
async function loadSummaryUI(){
  const d=await api("/api/summary");S.sum=d;const t=d.tiles;
  const k=$("#kpis");if(!k)return;
  k.innerHTML=[
    ["Заказано",t.ordered,"",`${t.ordered_items} позиций · ${t.ordered_count} партий`],
    ["Отдано авансами",t.prepaid,"v-cyan",t.ordered?Math.round(t.prepaid/t.ordered*100)+"% от суммы закупок":"—"],
    ["Остаток к оплате",t.balance,"v-amber",t.debt_suppliers?t.debt_suppliers+" поставщик(ов) ждут доплату":"долгов нет"],
    ["Сейчас в пути",t.transit,"v-green",t.transit_count?t.transit_count+" парт. · дольше всех "+t.transit_max_days+" дн.":"ничего не едет"],
  ].map(([l,v,c,dt])=>`<div class="glass kpi"><div class="lab">${l}</div>
    <div class="val ${c}" data-v="${v}">${money(v)}</div><div class="dt">${dt}</div></div>`).join("");
  $$("#kpis .val").forEach(el=>counter(el,+el.dataset.v));
  const a=$("#aside");if(!a)return;
  const mx=Math.max(...d.months.map(m=>m.total),1);
  a.innerHTML=`
    <div class="glass card"><h3>Инвесторы · доли</h3>
      <div class="empty" style="padding:16px 4px"><b style="font-size:14px">Появится на этапе 4</b>
      вложения, доли и выплаты</div></div>
    <div class="glass card"><h3>Закупки по месяцам</h3>
      <div class="bars">${d.months.map((m,i)=>`<i ${i===6?'class="cur"':""} data-h="${Math.round(m.total/mx*100)}" title="${money(m.total)}"></i>`).join("")}</div>
      <div class="bl">${d.months.map(m=>`<span>${["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"][+m.ym.slice(5)-1]}</span>`).join("")}</div></div>
    <div class="glass card"><h3>Ожидается прибытие</h3>
      ${d.arriving.length?d.arriving.map(x=>`<div class="stat"><span class="l">${esc(x.supplier)}</span>
        <span class="v ${x.eta&&x.eta<todayISO()?"v-amber":"v-green"}">${x.eta?dRu(x.eta):(x.days!=null?x.days+" дн. в пути":"—")}</span></div>`).join(""):
        '<div class="stat"><span class="l">Ничего не едет</span></div>'}</div>
    <div class="glass card"><h3>Долги поставщикам</h3>
      ${d.debts.length?d.debts.map(([n,v])=>`<div class="stat"><span class="l">${esc(n)}</span><span class="v">${money(v)}</span></div>`).join("")
        +`<div class="stat"><span class="l" style="color:var(--text);font-weight:650">Итого</span><span class="v v-amber">${money(t.balance)}</span></div>`:
        '<div class="stat"><span class="l">Долгов нет 🎉</span></div>'}</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$(".bars i").forEach(i=>i.style.height=i.dataset.h+"%")));
}
/* ---------- модалка партии ---------- */
let ITEMS=[];
function shipModal(s){
  const isNew=!s||!s.id;
  const sup=activeSuppliers();
  if(!sup.length&&isNew){toast("Сначала добавьте поставщика (раздел «Поставщики»)","err");return}
  if(!activeStores().length&&isNew){toast("Сначала добавьте магазин (раздел «Магазины»)","err");return}
  ITEMS=(s?.items||[{}]).map(i=>({...i}));
  if(!ITEMS.length)ITEMS=[{}];
  openModal(`<div class="mh"><h2>${isNew?"Новая партия":"Партия — "+esc(s.supplier_name)}</h2><button class="x" data-x>×</button></div>
   <div class="mb"><div class="frm">
    <div class="fg c3"><label>Дата заказа</label><input type="date" id="f-date" value="${s?.date||todayISO()}"></div>
    <div class="fg c6"><label>Поставщик</label><select id="f-sup">
      ${sup.map(p=>`<option value="${p.id}" ${s?.supplier_id===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
    <div class="fg c3"><label>Валюта</label><select id="f-cur">
      ${["USD","CNY","KGS"].map(c=>`<option ${((s?.currency)||"USD")===c?"selected":""}>${c}</option>`).join("")}</select></div>
    <div class="fg c3"><label>Статус</label><select id="f-st">
      ${Object.entries(ST_RU).map(([v,l])=>`<option value="${v}" ${((s?.status)||"new")===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="fg c3"><label>Отправлена</label><input type="date" id="f-sent" value="${s?.sent_date||""}"></div>
    <div class="fg c3"><label>Ожидается</label><input type="date" id="f-eta" value="${s?.eta_date||""}"></div>
    <div class="fg c3"><label>Прибыла</label><input type="date" id="f-arr" value="${s?.arrived_date||""}"></div>
    <div class="fg c6"><label>Трек / накладная</label><input id="f-track" value="${esc(s?.track||"")}" placeholder="SF7742019"></div>
    <div class="fg c3"><label>Аванс</label><input type="number" step="0.01" id="f-pre" value="${s?.prepaid||""}" placeholder="0"></div>
    <div class="fg c3"><label>Курс к сому</label><input type="number" step="0.01" id="f-rate" value="${s?.rate||""}" placeholder="—"></div>
    <div class="fg c12"><label>Комментарий</label><input id="f-note" value="${esc(s?.note||"")}"></div>
   </div>
   <div class="itm-head"><h4>Товары в партии</h4><button class="ghost" style="margin-left:auto;padding:6px 12px;font-size:12.5px" id="f-add-itm">+ Товар</button></div>
   <div class="itm-cols"><span>Магазин</span><span>Наименование</span><span class="itm-qty">Кол-во</span><span class="itm-unitcol">Ед.</span><span class="itm-qty">Цена</span><span>Сумма</span><span></span></div>
   <div id="f-items"></div>
   <div class="msum"><span>Позиций: <b id="m-cnt">0</b></span><span>Сумма: <b id="m-sum">0</b></span><span>Остаток: <b id="m-bal">0</b></span></div>
   </div>
   <div class="mf"><button class="ghost" data-x>Отмена</button>
     ${isNew?'<button class="ghost" id="f-save-more">Сохранить и ещё одну</button>':""}
     <button class="pill" id="f-save">Сохранить</button></div>`);
  renderItems();
  $("#f-add-itm").onclick=()=>{ITEMS.push({});renderItems();
    const last=$("#f-items").lastElementChild;last?.querySelector(".i-prod")?.focus()};
  $("#f-pre").oninput=recalc;$("#f-cur").onchange=recalc;
  $("#f-st").onchange=()=>{const v=$("#f-st").value;
    if(v==="shipping"&&!$("#f-sent").value)$("#f-sent").value=todayISO();
    if(v==="arrived"&&!$("#f-arr").value)$("#f-arr").value=todayISO()};
  const save=async more=>{
    const body={date:$("#f-date").value,supplier_id:+$("#f-sup").value,currency:$("#f-cur").value,
      status:$("#f-st").value,sent_date:$("#f-sent").value||null,eta_date:$("#f-eta").value||null,
      arrived_date:$("#f-arr").value||null,track:$("#f-track").value,prepaid:+($("#f-pre").value||0),
      rate:+($("#f-rate").value||0)||null,note:$("#f-note").value,
      items:ITEMS.filter(i=>i.product||i.amount).map(i=>({store_id:+i.store_id||null,product:(i.product||"").trim(),
        qty:+i.qty||null,unit:i.unit||"шт",unit_price:+i.unit_price||null,amount:+i.amount||0,note:i.note||""}))};
    try{
      await api(isNew?"/api/shipments":"/api/shipments/"+s.id,{method:isNew?"POST":"PATCH",body});
      toast(isNew?"Партия создана":"Сохранено","ok");
      loadShips();loadSummaryUI();loadRefs();
      if(more){shipModal()}else closeModal();
    }catch(e){toast(e.message,"err")}
  };
  $("#f-save").onclick=()=>save(false);
  if(isNew)$("#f-save-more").onclick=()=>save(true);
}
function renderItems(){
  const stores=activeStores();
  const defStore=ITEMS.find(i=>i.store_id)?.store_id||stores[0]?.id;
  $("#f-items").innerHTML=ITEMS.map((i,n)=>`<div class="itm-row" data-n="${n}">
    <select class="i-store">${stores.map(st=>`<option value="${st.id}" ${(+i.store_id||defStore)===st.id?"selected":""}>№${esc(st.number)}</option>`).join("")}</select>
    <input class="i-prod" value="${esc(i.product||"")}" placeholder="Наименование товара" list="prod-hints">
    <input class="i-qty itm-qty" type="number" step="0.01" value="${i.qty||""}" placeholder="0">
    <select class="i-unit itm-unitcol">${["шт","кор","кг","м","компл"].map(u=>`<option ${(i.unit||"шт")===u?"selected":""}>${u}</option>`).join("")}</select>
    <input class="i-price itm-qty" type="number" step="0.01" value="${i.unit_price||""}" placeholder="0">
    <input class="i-amount" type="number" step="0.01" value="${i.amount||""}" placeholder="0">
    <button class="itm-del" title="Убрать">×</button></div>`).join("")+
    `<datalist id="prod-hints">${[...new Set((S.ships?.rows||[]).flatMap(s=>s.items.map(i=>i.product)))].slice(0,60)
      .map(p=>`<option value="${esc(p)}">`).join("")}</datalist>`;
  $$("#f-items .itm-row").forEach(row=>{
    const n=+row.dataset.n,i=ITEMS[n];
    const sync=()=>{i.store_id=row.querySelector(".i-store").value;i.product=row.querySelector(".i-prod").value;
      i.qty=row.querySelector(".i-qty").value;i.unit=row.querySelector(".i-unit").value;
      i.unit_price=row.querySelector(".i-price").value;i.amount=row.querySelector(".i-amount").value;recalc()};
    row.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",()=>{
      if((el.classList.contains("i-qty")||el.classList.contains("i-price"))){
        const q=+row.querySelector(".i-qty").value,p=+row.querySelector(".i-price").value;
        if(q&&p)row.querySelector(".i-amount").value=Math.round(q*p*100)/100;}
      sync()}));
    row.querySelector(".itm-del").onclick=()=>{ITEMS.splice(n,1);if(!ITEMS.length)ITEMS.push({});renderItems()};
  });
  recalc();
}
function recalc(){
  const cur=$("#f-cur")?.value||"USD";
  const sum=ITEMS.reduce((a,i)=>a+(+i.amount||0),0);
  const cnt=ITEMS.filter(i=>i.product||+i.amount).length;
  if($("#m-cnt")){$("#m-cnt").textContent=cnt;$("#m-sum").textContent=money(sum,cur);
    $("#m-bal").textContent=money(sum-(+$("#f-pre")?.value||0),cur)}
}
/* ---------- ПОСТАВЩИКИ ---------- */
async function renderPartners(){
  await loadRefs();
  const rows=S.partners;
  $("#main").innerHTML=headHtml("Поставщики <span>и партнёры</span>",rows.length+" контрагентов",
    `<button class="pill" id="add-p">+ Контрагент</button>`)+
   `<div class="glass panel"><div class="list-wrap"><table class="list-tbl">
    <tr><th>Название</th><th>Тип</th><th>Город · контакт</th><th class="num">Партий</th>
      <th class="num">Оборот</th><th class="num">Отдано</th><th class="num">Долг</th><th class="num">В пути</th><th></th></tr>
    ${rows.length?rows.map(p=>`<tr class="${p.active?"":"inactive"}" data-id="${p.id}">
      <td><b>${esc(p.name)}</b>${p.active?"":" <span class='chip'>скрыт</span>"}</td>
      <td>${[p.is_supplier?"поставщик":"",p.is_investor?"инвестор":""].filter(Boolean).join(" + ")||"—"}</td>
      <td style="color:var(--muted)">${esc([p.city,p.contact].filter(Boolean).join(" · "))||"—"}</td>
      <td class="num">${p.shipments}</td><td class="num">${money(p.total)}</td>
      <td class="num">${money(p.prepaid)}</td>
      <td class="num" style="color:${p.debt>0.004?"var(--amber)":"var(--dim)"}">${money(p.debt)}</td>
      <td class="num" style="color:${p.transit?"var(--green)":"var(--dim)"}">${money(p.transit)}</td>
      <td class="num"><button class="mini-btn" data-edit>✎</button><button class="mini-btn" data-del>🗑</button></td>
    </tr>`).join(""):`<tr><td colspan="9"><div class="empty"><b>Контрагентов пока нет</b>Добавьте первого поставщика</div></td></tr>`}
   </table></div></div>`;
  $("#add-p").onclick=()=>partnerModal();
  $$("tr[data-id]").forEach(tr=>{
    const p=rows.find(x=>x.id===+tr.dataset.id);
    tr.querySelector("[data-edit]").onclick=()=>partnerModal(p);
    tr.querySelector("[data-del]").onclick=async()=>{
      if(await confirmBox("Удалить контрагента?",p.name+(p.shipments?" — у него есть партии, он будет скрыт с сохранением истории":""),true)){
        const r=await api("/api/partners/"+p.id,{method:"DELETE"});
        toast(r.msg||"Удалено","ok");renderPartners();}};
  });
}
function partnerModal(p){
  openModal(`<div class="mh"><h2>${p?"Контрагент":"Новый контрагент"}</h2><button class="x" data-x>×</button></div>
   <div class="mb"><div class="frm">
    <div class="fg c12"><label>Название</label><input id="p-name" value="${esc(p?.name||"")}" placeholder="Гуанчжоу — Чен"></div>
    <div class="fg c6"><label>Тип</label><div style="display:flex;gap:14px;padding:9px 2px">
      <label style="display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--text)"><input type="checkbox" id="p-sup" ${(p?p.is_supplier:1)?"checked":""}> поставщик</label>
      <label style="display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--text)"><input type="checkbox" id="p-inv" ${p?.is_investor?"checked":""}> инвестор</label></div></div>
    <div class="fg c6"><label>Город</label><input id="p-city" value="${esc(p?.city||"")}" placeholder="Гуанчжоу"></div>
    <div class="fg c6"><label>Контакт (WeChat / WhatsApp)</label><input id="p-contact" value="${esc(p?.contact||"")}"></div>
    <div class="fg c6"><label>Валюта по умолчанию</label><select id="p-cur">${["USD","CNY","KGS"].map(c=>`<option ${((p?.currency)||"USD")===c?"selected":""}>${c}</option>`).join("")}</select></div>
    <div class="fg c12"><label>Комментарий</label><input id="p-note" value="${esc(p?.note||"")}"></div>
    ${p&&!p.active?'<div class="fg c12"><label style="display:flex;gap:6px;align-items:center;color:var(--text);font-size:13.5px"><input type="checkbox" id="p-act"> показать снова (сейчас скрыт)</label></div>':""}
   </div></div>
   <div class="mf"><button class="ghost" data-x>Отмена</button><button class="pill" id="p-save">Сохранить</button></div>`);
  $("#p-save").onclick=async()=>{
    try{
      await api(p?"/api/partners/"+p.id:"/api/partners",{method:p?"PATCH":"POST",body:{
        name:$("#p-name").value,is_supplier:$("#p-sup").checked?1:0,is_investor:$("#p-inv").checked?1:0,
        city:$("#p-city").value,contact:$("#p-contact").value,currency:$("#p-cur").value,note:$("#p-note").value,
        active:p&&!p.active?($("#p-act").checked?1:0):1}});
      toast("Сохранено","ok");closeModal();renderPartners();
    }catch(e){toast(e.message,"err")}};
}
/* ---------- МАГАЗИНЫ ---------- */
async function renderStores(){
  await loadRefs();
  const rows=S.stores;
  $("#main").innerHTML=headHtml("Магазины","куда едет товар",`<button class="pill" id="add-s">+ Магазин</button>`)+
   `<div class="glass panel"><div class="list-wrap"><table class="list-tbl">
    <tr><th>Номер</th><th>Название</th><th class="num">Партий</th><th class="num">Позиций</th>
      <th class="num">Сумма</th><th class="num">В пути</th><th></th></tr>
    ${rows.length?rows.map(s=>`<tr class="${s.active?"":"inactive"}" data-id="${s.id}">
      <td><span class="badge">№${esc(s.number)}</span></td><td><b>${esc(s.name||"—")}</b>${s.active?"":" <span class='chip'>скрыт</span>"}</td>
      <td class="num">${s.shipments}</td><td class="num">${s.items}</td>
      <td class="num">${money(s.total)}</td>
      <td class="num" style="color:${s.transit?"var(--green)":"var(--dim)"}">${money(s.transit)}</td>
      <td class="num"><button class="mini-btn" data-edit>✎</button><button class="mini-btn" data-del>🗑</button></td>
    </tr>`).join(""):`<tr><td colspan="7"><div class="empty"><b>Магазинов пока нет</b>Добавьте первый — номер и название</div></td></tr>`}
   </table></div></div>`;
  $("#add-s").onclick=()=>storeModal();
  $$("tr[data-id]").forEach(tr=>{
    const s=rows.find(x=>x.id===+tr.dataset.id);
    tr.querySelector("[data-edit]").onclick=()=>storeModal(s);
    tr.querySelector("[data-del]").onclick=async()=>{
      if(await confirmBox("Удалить магазин?","№"+s.number+(s.items?" — участвует в партиях, будет скрыт":""),true)){
        const r=await api("/api/stores/"+s.id,{method:"DELETE"});toast(r.msg||"Удалено","ok");renderStores();}};
  });
}
function storeModal(s){
  openModal(`<div class="mh"><h2>${s?"Магазин №"+esc(s.number):"Новый магазин"}</h2><button class="x" data-x>×</button></div>
   <div class="mb"><div class="frm">
    <div class="fg c3"><label>Номер</label><input id="s-num" value="${esc(s?.number||"")}" placeholder="1"></div>
    <div class="fg c9"><label>Название</label><input id="s-name" value="${esc(s?.name||"")}" placeholder="Дордой, 3 ряд"></div>
    <div class="fg c12"><label>Комментарий</label><input id="s-note" value="${esc(s?.note||"")}"></div>
    ${s&&!s.active?'<div class="fg c12"><label style="display:flex;gap:6px;align-items:center;color:var(--text);font-size:13.5px"><input type="checkbox" id="s-act"> показать снова</label></div>':""}
   </div></div>
   <div class="mf"><button class="ghost" data-x>Отмена</button><button class="pill" id="s-save">Сохранить</button></div>`,true);
  $("#s-save").onclick=async()=>{
    try{
      await api(s?"/api/stores/"+s.id:"/api/stores",{method:s?"PATCH":"POST",body:{
        number:$("#s-num").value,name:$("#s-name").value,note:$("#s-note").value,
        active:s&&!s.active?($("#s-act").checked?1:0):1}});
      toast("Сохранено","ok");closeModal();renderStores();
    }catch(e){toast(e.message,"err")}};
}
/* ---------- ИНВЕСТОРЫ (этап 4) ---------- */
async function renderInvestors(){
  await loadRefs();
  const inv=S.partners.filter(p=>p.is_investor);
  $("#main").innerHTML=headHtml("Инвесторы <span>и доли</span>","вложения · начисления · выплаты","")+
   `<div class="glass panel"><div class="empty" style="padding:70px 20px">
     <b>Раздел появится на этапе 4</b>
     Вложения в партии и общий пул, условия «доля от прибыли» и «процент в месяц»,<br>начисления, выплаты и отчёт инвестору.
     ${inv.length?`<div class="chips" style="justify-content:center;margin-top:18px">${inv.map(p=>`<span class="chip">${esc(p.name)}</span>`).join("")}</div>
     <div style="color:var(--dim);font-size:12.5px;margin-top:10px">Эти контрагенты уже помечены как инвесторы — они подхватятся автоматически</div>`:""}
   </div></div>`;
}
/* ---------- СВОДКА ---------- */
async function renderSummary(){
  $("#main").innerHTML=headHtml("Сводка","вся картина за всё время",
    `<a class="ghost" href="/api/export.csv" download>⬇ Экспорт в Excel</a>`)+
   `<div class="kpis" id="kpis"></div><div class="grid"><div class="glass panel" id="sum-left">
    <div class="ph"><h2>Ожидается прибытие</h2></div><div id="arr-list"><div class="empty">Загрузка…</div></div>
   </div><aside id="aside"></aside></div>`;
  await loadRefs();await loadSummaryUI();
  const d=S.sum;
  $("#arr-list").innerHTML=d.arriving.length?d.arriving.map(x=>`
    <div class="ship" style="cursor:default"><div class="ship-top">
      <div><div class="who">${esc(x.supplier)}</div>
      <div class="meta">${x.days!=null?"в пути "+x.days+" дн.":""}</div></div>
      <div class="money"><b>${money(x.amount)}</b>
      <div class="m2 ${x.eta&&x.eta<todayISO()?"v-amber":""}">${x.eta?(x.eta<todayISO()?"ждали ":"ожидается ")+dRu(x.eta):"срок не указан"}</div></div>
    </div></div>`).join(""):'<div class="empty"><b>Ничего не едет</b>Все партии на месте</div>';
}
/* ---------- НАСТРОЙКИ ---------- */
function renderSettings(){
  $("#main").innerHTML=headHtml("Настройки","",`<div class="glass avatar">${esc((S.user?.name||"А")[0])}</div>`)+
   `<div class="grid" style="grid-template-columns:1fr 1fr;max-width:900px">
    <div class="glass card"><h3>Данные</h3>
      <div class="stat"><span class="l">Экспорт всех партий в Excel (CSV)</span><a class="ghost" href="/api/export.csv" download>Скачать</a></div>
      <div class="stat"><span class="l">Резервная копия базы</span><button class="ghost" id="bk">Сделать сейчас</button></div>
      <div class="stat"><span class="l" style="font-size:12px;color:var(--dim)">Копия делается сама при каждом запуске, хранится 30 последних в папке backups</span></div>
    </div>
    <div class="glass card"><h3>Аккаунт</h3>
      <div class="stat"><span class="l">Вы вошли как</span><span class="v">${esc(S.user?.name||S.user?.login||"")}</span></div>
      <div class="stat"><span class="l">Роль</span><span class="v">${S.user?.role==="owner"?"Владелец":"Помощник"}</span></div>
      <div class="stat"><span class="l">Выйти из программы</span><button class="ghost" id="out">Выйти</button></div>
    </div></div>`;
  $("#bk").onclick=async()=>{const r=await api("/api/backup",{method:"POST"});toast("Копия: "+r.file,"ok")};
  $("#out").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()};
}
/* ---------- старт ---------- */
(async function(){
  const h=location.hash.replace("#","");
  if(["ships","partners","investors","stores","summary","settings"].includes(h))S.section=h;
  try{S.user=await api("/api/me");$("#app").style.display="";go(S.section)}
